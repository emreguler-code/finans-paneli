name: Hosting release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Validate release tag
        id: validate
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - id: dependencies
        run: npm ci
      - id: tests
        run: npm test
      - name: Check PHP syntax
        id: php
        run: |
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find public -name '*.php' ! -name 'config.php' -print0)
      - name: Test financial API and migration recovery
        id: api
        run: |
          npm run test:api
          npm run test:migrations
      - name: Install Chromium for browser checks
        id: chromium
        run: npx playwright install --with-deps chromium
      - name: Test desktop and mobile workflows
        id: browser
        run: npm run test:browser
      - name: Package hosting files
        id: package
        run: python3 scripts/package-release.py
      - name: Test packaged hosting installation
        id: installcheck
        run: npm run test:package
      - name: Verify archive
        id: archive
        run: |
          cd dist/releases
          sha256sum -c *.sha256
          python3 -m zipfile -t *.zip
      - uses: actions/upload-artifact@v6
        with:
          name: hosting-package
          path: dist/releases/*
      - name: Publish GitHub release
        id: publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Finans Paneli $GITHUB_REF_NAME" --notes-file docs/RELEASE-NOTES.md
          gh release upload "$GITHUB_REF_NAME" dist/releases/* --clobber
          gh release view "$GITHUB_REF_NAME" --json isDraft,url,assets > /tmp/finans-published-release.json
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          release = json.loads(Path('/tmp/finans-published-release.json').read_text())
          expected = 'finans-paneli-' + os.environ['GITHUB_REF_NAME'].removeprefix('v') + '.zip'
          names = {asset['name'] for asset in release['assets']}
          assert not release['isDraft'] and {expected, expected + '.sha256'} <= names, 'Release assets are missing'
          PYCODE
      - name: Record release result for Git-only clients
        if: always() && startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_RESULT: ${{ job.status }}
          STEP_RESULTS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          tag = os.environ['GITHUB_REF_NAME']
          repository = os.environ['GITHUB_REPOSITORY']
          receipt = {'tag': tag, 'status': os.environ['RELEASE_RESULT'], 'run': f"https://github.com/{repository}/actions/runs/{os.environ['GITHUB_RUN_ID']}", 'release': f"https://github.com/{repository}/releases/tag/{tag}"}
          receipt['commit'] = os.environ['GITHUB_SHA']
          receipt['steps'] = {key: value.get('conclusion') for key, value in json.loads(os.environ['STEP_RESULTS']).items()}
          receipt['failedChecks'] = {str(p): p.read_text()[:5000] for p in Path('.qa').glob('*/browser/failure.txt')}
          checksums = list(Path('dist/releases').glob('*.sha256'))
          if checksums:
              receipt['checksums'] = {p.name: p.read_text().strip() for p in checksums}
          published = Path('/tmp/finans-published-release.json')
          if published.exists():
              receipt['published'] = json.loads(published.read_text())
          Path('/tmp/finans-release-result.json').write_text(json.dumps(receipt, indent=2))
          PYCODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa "release-status/$GITHUB_REF_NAME" -F /tmp/finans-release-result.json
          git push --force origin "refs/tags/release-status/$GITHUB_REF_NAME"
