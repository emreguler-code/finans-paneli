name: Hosting release
on:
  push:
    tags: ["v*"]
    branches: ["release/v*"]
  workflow_dispatch:
    inputs:
      publish_hosting:
        description: "Add hosting-only ZIP to existing release after verifying identical application files"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  package:
    needs: windows-layout
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version-file: ".python-version"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: ".node-version"
          cache: npm
      - name: Validate release ref
        id: validate
        run: |
          RELEASE_TAG="v$(node -p "require('./package.json').version")"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "$RELEASE_TAG"
          elif [[ "$GITHUB_EVENT_NAME" == push ]]; then
            test "$GITHUB_REF_NAME" = "release/$RELEASE_TAG"
          fi
      - name: Use project npm version
        run: npm install --global npm@12.2.2
      - id: dependencies
        run: npm ci
      - id: tests
        run: npm test
      - run: npm run audit:security
      - name: Check PHP syntax
        id: php
        run: |
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find public -name '*.php' ! -name 'config.php' -print0)
      - name: Test financial API and migration recovery
        id: api
        run: |
          npm run test:api
          npm run test:migrations
          npm run test:backups
      - name: Prepare browser for checks
        id: chromium
        timeout-minutes: 5
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$browser_path" ]; then
            "$browser_path" --version
            echo "QA_BROWSER_BIN=$browser_path" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Prepare WebKit for mobile checks
        run: npx playwright install --with-deps webkit firefox
      - name: Check compact party UI against synthetic API
        run: npm run test:party-ui
      - name: Test desktop and mobile workflows
        id: browser
        run: npm run test:browser
      - name: Test mobile layouts across Chromium and WebKit
        id: mobile
        run: npm run test:mobile
      - name: Reconcile comprehensive demo and reports
        id: demo
        run: npm run test:demo
      - name: Package hosting files
        id: package
        run: python3 scripts/package-release.py
      - name: Test packaged hosting installation
        id: installcheck
        run: npm run test:package
      - name: Verify archive
        id: archive
        run: |
          cd dist/releases
          sha256sum -c *.sha256
          for archive in *.zip; do python3 -m zipfile -t "$archive"; done
      - name: Verify repository hosting package
        run: |
          python3 - <<'PYCODE'
          import hashlib, json
          from pathlib import Path
          version = json.loads(Path('package.json').read_text())['version']
          name = f'finans-paneli-{version}-hosting.zip'
          committed = Path('releases') / version / name
          generated = Path('dist/releases') / name
          assert committed.read_bytes() == generated.read_bytes(), 'Repository hosting ZIP differs from the tested release package'
          checksum = committed.with_suffix('.zip.sha256').read_text().split()[0]
          assert hashlib.sha256(committed.read_bytes()).hexdigest() == checksum, 'Repository ZIP checksum is invalid'
          PYCODE
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: hosting-package
          path: dist/releases/*
      - name: Add hosting archive to existing release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_hosting
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p /tmp/finans-existing-release
          gh release download "v$VERSION" --pattern "finans-paneli-$VERSION.zip" --dir /tmp/finans-existing-release
          python3 - <<'PYCODE'
          import json, zipfile
          from pathlib import Path
          version = json.loads(Path('package.json').read_text())['version']
          with zipfile.ZipFile(f'/tmp/finans-existing-release/finans-paneli-{version}.zip') as full, zipfile.ZipFile(f'dist/releases/finans-paneli-{version}-hosting.zip') as hosting:
              expected = {name.removeprefix('hosting/'): full.read(name) for name in full.namelist() if name.startswith('hosting/')}
              expected['licenses/Inter-OFL.txt'] = full.read('licenses/Inter-OFL.txt')
              assert set(hosting.namelist()) == set(expected), 'Hosting archive must match existing release'
              assert all(hosting.read(name) == content for name, content in expected.items()), 'Application files changed; publish a new version instead'
          PYCODE
          gh release upload "v$VERSION" "dist/releases/finans-paneli-$VERSION-hosting.zip" "dist/releases/finans-paneli-$VERSION-hosting.zip.sha256"
      - name: Publish GitHub release
        id: publish
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "Finans Paneli $RELEASE_TAG" --notes-file docs/RELEASE-NOTES.md
          gh release upload "$RELEASE_TAG" dist/releases/* --clobber
          gh release view "$RELEASE_TAG" --json isDraft,url,assets > /tmp/finans-published-release.json
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          release = json.loads(Path('/tmp/finans-published-release.json').read_text())
          expected = 'finans-paneli-' + os.environ['RELEASE_TAG'].removeprefix('v') + '.zip'
          names = {asset['name'] for asset in release['assets']}
          hosting = expected.removesuffix('.zip') + '-hosting.zip'
          assert not release['isDraft'] and {expected, expected + '.sha256', hosting, hosting + '.sha256'} <= names, 'Release assets are missing'
          PYCODE
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: party-ui-evidence
          path: .qa/party121/
          if-no-files-found: ignore
      - name: Record release result for Git-only clients
        if: always() && github.event_name == 'push' && steps.validate.conclusion == 'success'
        env:
          RELEASE_RESULT: ${{ job.status }}
          STEP_RESULTS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          repository = os.environ['GITHUB_REPOSITORY']
          receipt = {'tag': tag, 'status': os.environ['RELEASE_RESULT'], 'run': f"https://github.com/{repository}/actions/runs/{os.environ['GITHUB_RUN_ID']}", 'release': f"https://github.com/{repository}/releases/tag/{tag}"}
          receipt['commit'] = os.environ['GITHUB_SHA']
          receipt['steps'] = {key: value.get('conclusion') for key, value in json.loads(os.environ['STEP_RESULTS']).items()}
          receipt['failedChecks'] = {str(p): p.read_text()[:5000] for p in Path('.qa').glob('*/*/failure.txt')}
          receipt['failedLayouts'] = {str(p): json.loads(p.read_text()) for p in Path('.qa').glob('*/browser/failure-layout.json')}
          checksums = list(Path('dist/releases').glob('*.sha256'))
          if checksums:
              receipt['checksums'] = {p.name: p.read_text().strip() for p in checksums}
          published = Path('/tmp/finans-published-release.json')
          if published.exists():
              receipt['published'] = json.loads(published.read_text())
          Path('/tmp/finans-release-result.json').write_text(json.dumps(receipt, indent=2))
          PYCODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa "release-status/$RELEASE_TAG" -F /tmp/finans-release-result.json
          git push --force origin "refs/tags/release-status/$RELEASE_TAG"

  windows-layout:
    name: Windows Firefox and Chromium layout
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version-file: ".python-version"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: ".node-version"
          cache: npm
      - run: npm install --global npm@12.2.2
      - run: npm ci
      - run: npm test
      - run: npx playwright install firefox chromium
      - run: npm run test:party-ui
        env:
          QA_BROWSER_ENGINES: firefox,chromium
      - name: Save Windows layout evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-layout-evidence
          path: .qa/party121/
          if-no-files-found: ignore
