name: Hosting release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: npm ci
      - run: npm test
      - name: Check PHP syntax
        run: |
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find public -name '*.php' ! -name 'config.php' -print0)
      - name: Test financial API and migration recovery
        run: |
          npm run test:api
          npm run test:migrations
      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps chromium
      - name: Test desktop and mobile workflows
        run: npm run test:browser
      - name: Package hosting files
        run: python3 scripts/package-release.py
      - name: Test packaged hosting installation
        run: npm run test:package
      - name: Verify archive
        run: |
          cd dist/releases
          sha256sum -c *.sha256
          python3 -m zipfile -t *.zip
      - uses: actions/upload-artifact@v4
        with:
          name: hosting-package
          path: dist/releases/*
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Finans Paneli $GITHUB_REF_NAME" --notes-file docs/RELEASE-NOTES.md
          gh release upload "$GITHUB_REF_NAME" dist/releases/* --clobber
