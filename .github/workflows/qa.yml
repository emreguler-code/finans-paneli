name: Candidate QA
on:
  push:
    branches: ["codex/1.25.1"]
    paths-ignore: ["docs/**", "README.md", "AGENTS.md"]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version-file: ".python-version"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: ".node-version"
          cache: npm
      - run: npm install --global npm@12.2.2
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=moderate
      - name: Check PHP syntax
        run: |
          while IFS= read -r -d '' file; do php -l "$file"; done < <(find public -name '*.php' ! -name 'config.php' -print0)
      - name: Prepare browser for checks
        id: chromium
        timeout-minutes: 5
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$browser_path" ]; then
            "$browser_path" --version
            echo "QA_BROWSER_BIN=$browser_path" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Prepare WebKit for mobile checks
        run: npx playwright install --with-deps webkit firefox
      - run: npm run test:party-ui
      - name: Package and verify candidate
        run: |
          python3 scripts/package-release.py
          cd dist/releases
          sha256sum -c *.sha256
          for archive in *.zip; do python3 -m zipfile -t "$archive"; done
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: hosting-package
          path: dist/releases/*
      - name: Collect browser screenshots and check results
        if: always()
        run: |
          python3 - <<'PYCODE'
          import shutil
          from pathlib import Path
          for p in Path('.qa').rglob('*'):
              if p.is_file() and (p.suffix == '.png' or p.name in ['checks.json','failure.txt','failure-layout.json'] or p.name.endswith('-failure.txt')):
                  target = Path('qa-evidence') / p.relative_to('.qa')
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(p, target)
          PYCODE
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: candidate-ui-evidence-frontend
          path: qa-evidence/
          if-no-files-found: ignore
  integration:
    name: Integration (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [api, migrations, backups, browser, mobile, demo, package]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version-file: ".python-version"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: ".node-version"
          cache: npm
      - run: npm install --global npm@12.2.2
      - run: npm ci
      - run: npm run build
      - name: Prepare Chrome
        run: echo "QA_BROWSER_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Prepare WebKit
        if: matrix.suite == 'mobile'
        run: npx playwright install --with-deps webkit firefox
      - name: Package installation fixture
        if: matrix.suite == 'package'
        run: python3 scripts/package-release.py
      - name: Test ${{ matrix.suite }}
        run: npm run test:${{ matrix.suite }}
      - name: Collect browser screenshots and check results
        if: always()
        run: |
          python3 - <<'PYCODE'
          import shutil
          from pathlib import Path
          for p in Path('.qa').rglob('*'):
              if p.is_file() and (p.suffix == '.png' or p.name in ['checks.json','failure.txt','failure-layout.json'] or p.name.endswith('-failure.txt')):
                  target = Path('qa-evidence') / p.relative_to('.qa')
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(p, target)
          PYCODE
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: candidate-ui-evidence-${{ matrix.suite }}
          path: qa-evidence/
          if-no-files-found: ignore

  windows-layout:
    name: Windows Firefox and Chromium layout
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version-file: ".python-version"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: ".node-version"
          cache: npm
      - run: npm install --global npm@12.2.2
      - run: npm ci
      - run: npm test
      - run: npx playwright install firefox chromium
      - run: npm run test:party-ui
        env:
          QA_BROWSER_ENGINES: firefox,chromium
      - name: Save Windows layout evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-layout-evidence
          path: .qa/party121/
          if-no-files-found: ignore
